<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConexãoPro - Vagas</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header { background:#fff; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); padding:16px 20px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .page-header h1 { font-size:22px; font-weight:700; color:#1877f2; margin:0; }
    .page-header a { padding:8px 16px; background:#1877f2; color:#fff; border-radius:6px; font-size:14px; font-weight:600; text-decoration:none; }
    .page-header a:hover { background:#166fe5; }
    .vagas-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .vaga-card { background:#fff; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); padding:24px; transition:box-shadow .2s,transform .2s; border-left:4px solid #f59e0b; }
    .vaga-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.15); transform:translateY(-2px); }
    .vaga-header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .vaga-icon { font-size:32px; }
    .vaga-tipo-badge { display:inline-block; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; }
    .vaga-tipo-badge.estagio { background:#fff3e0; color:#e65100; }
    .vaga-tipo-badge.aprendiz { background:#e8f5e9; color:#2e7d32; }
    .vaga-tipo-badge.clt { background:#e3f2fd; color:#1565c0; }
    .vaga-tipo-badge.pj { background:#f3e5f5; color:#7b1fa2; }
    .vaga-card h3 { font-size:18px; font-weight:600; color:#1c1e21; margin-bottom:4px; }
    .vaga-empresa { font-size:15px; font-weight:500; color:#1c1e21; margin-bottom:2px; }
    .vaga-local { font-size:14px; color:#606770; margin-bottom:12px; }
    .vaga-card p.descricao { font-size:14px; color:#606770; line-height:1.5; margin-bottom:16px; }
    .vaga-footer { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .btn-candidatar { padding:10px 24px; background:#42b72a; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; transition:background .2s; }
    .btn-candidatar:hover { background:#36a420; }
    .banner-vagas { background:linear-gradient(135deg,#f59e0b,#1877f2); border-radius:8px; padding:32px; color:#fff; margin-bottom:16px; text-align:center; }
    .banner-vagas h2 { font-size:26px; font-weight:700; margin-bottom:4px; }
    .banner-vagas p { font-size:15px; opacity:.9; }
    .vaga-destaque { border-left-color:#42b72a; background: linear-gradient(to right, #f0fff4, #fff); }
    @media(max-width:768px){ .vagas-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="feed-page">
    <header class="feed-header">
      <div class="header-inner">
        <div class="header-logo"><img src="assets/logo.png" alt="ConexãoPro" class="logo-img" /></div>
        <div class="header-actions">
          <div class="header-user-info"><p id="userNome" class="header-user-name"></p><p id="userCargo" class="header-user-cargo"></p></div>
          <div id="avatarInicial" class="header-avatar" title="Meu perfil"></div>
          <button id="sairBtn" class="btn-sair">Sair</button>
        </div>
    </header>
    <div style="max-width:900px;margin:76px auto 20px;padding:0 16px;">
      <div class="page-header">
        <h1>💼 Vagas e Oportunidades</h1>
        <a href="feed.html">← Voltar ao Feed</a>
      </div>
      <div class="banner-vagas">
        <h2>Encontre a oportunidade ideal para você</h2>
        <p>Estágios, programas de aprendizagem e vagas CLT/PJ para alunos do SENAI</p>
      </div>
      <div id="vagasContainer" class="vagas-grid"></div>
  </div>
  <script src="js/database.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var sessao = Database.auth.usuarioAtual();
      if(!sessao){ window.location.href='index.html'; return; }
      document.getElementById('userNome').textContent = sessao.nome;
      document.getElementById('userCargo').textContent = sessao.cargo || 'aluno';
      document.getElementById('avatarInicial').textContent = sessao.nome.charAt(0).toUpperCase();

      var container = document.getElementById('vagasContainer');
      var vagas = Database.vagasExemplo;

      for(var i=0;i<vagas.length;i++){
        var v = vagas[i];
        var tipoLower = v.tipo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var card = document.createElement('div');
        card.className = 'vaga-card' + (i===0 ? ' vaga-destaque' : '');

        var tipoBadge = '<span class="vaga-tipo-badge '+tipoLower+'">'+escapeHtml(v.tipo)+'</span>';

        card.innerHTML =
          '<div class="vaga-header">' +
            '<div class="vaga-icon">💼</div>' +
            tipoBadge +
          '</div>' +
          '<h3>'+escapeHtml(v.titulo)+'</h3>' +
          '<div class="vaga-empresa">🏢 '+escapeHtml(v.empresa)+'</div>' +
          '<div class="vaga-local">📍 '+escapeHtml(v.local)+'</div>' +
          '<p class="descricao">'+escapeHtml(v.descricao)+'</p>' +
          '<div class="vaga-footer">' +
            '<button class="btn-candidatar" data-vaga="'+escapeHtml(v.titulo)+'" data-empresa="'+escapeHtml(v.empresa)+'">📩 Candidatar-se</button>' +
          '</div>';

        container.appendChild(card);
      }

      document.querySelectorAll('.btn-candidatar').forEach(function(btn){
        btn.addEventListener('click', function(){
          var titulo = this.getAttribute('data-vaga');
          var empresa = this.getAttribute('data-empresa');
          this.textContent = '✅ Candidatura enviada!';
          this.style.background = '#1877f2';
          this.disabled = true;
          setTimeout(function(){
            btn.textContent = '📩 Candidatar-se';
            btn.style.background = '#42b72a';
            btn.disabled = false;
          }, 3000);
        });
      });

      document.getElementById('sairBtn').addEventListener('click',function(){ Database.auth.logout(); window.location.href='index.html'; });
    });
    function escapeHtml(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  </script>
</body>
</html>
