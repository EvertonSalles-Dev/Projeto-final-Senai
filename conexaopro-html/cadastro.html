<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConexãoPro - Cadastro</title>
  <meta name="description" content="Rede social da comunidade SENAI" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="cadastro-page">
    <section class="cadastro-card">
      <div class="cadastro-header">
        <h1>Criar uma nova conta</h1>
        <p>É rápido e fácil.</p>
      </div>

      <form id="cadastroForm" class="cadastro-form">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input
            id="nome"
            name="nome"
            type="text"
            placeholder="Nome completo"
          />
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input
            id="matricula"
            name="matricula"
            type="text"
            placeholder="Número da matrícula"
          />
        </div>

        <div class="form-group">
          <label for="dataNascimento">Data de nascimento</label>
          <input
            id="dataNascimento"
            name="dataNascimento"
            type="date"
          />
        </div>

        <div class="form-group">
          <label for="senhaCadastro">Criar senha</label>
          <input
            id="senhaCadastro"
            name="senhaCadastro"
            type="password"
            placeholder="Crie uma senha"
          />
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input
            id="confirmarSenha"
            name="confirmarSenha"
            type="password"
            placeholder="Confirme a senha"
          />
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>

        <button id="cadastroBtn" type="submit" class="btn-primary">
          <span id="btnText">Cadastrar</span>
        </button>
      </form>

      <p class="login-footer">
        Já possui cadastro? <a href="index.html">Faça login</a>
      </p>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/matriculas.js"></script>
  <script src="js/database.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
